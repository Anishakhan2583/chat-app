<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Premium Advanced Chatroom & Video Calling</title>
  <style>
    /* Base Reset & Colors */
    *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #334155; }
    html, body { height: 100%; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
    
    /* Layout Framework Grid styles */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .hidden { display: none; }
    @media (min-width: 768px) { .md\:flex { display: flex; } .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    
    /* Utility Utility Styles Mapping classes configuration */
    .w-full { width: 100%; }
    .max-w-5xl { max-w: 64rem; }
    .max-w-md { max-w: 28rem; }
    .max-w-4xl { max-w: 56rem; }
    .max-w-\[85\%\] { max-w: 85%; }
    .h-screen { height: 100vh; }
    .h-\[90vh\] { height: 90vh; }
    .h-full { height: 100%; }
    .h-6 { height: 1.5rem; }
    .max-h-\[60vh\] { max-h: 60vh; }
    
    /* Spacing & Borders handles adjustments mapping options */
    .p-2 { padding: 0.5rem; }
    .p-3 { padding: 0.75rem; }
    .p-4 { padding: 1rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
    .pb-4 { padding-bottom: 1rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-1 { margin-top: 0.25rem; }
    .space-x-2 > :not([hidden]) ~ :not([hidden]) { margin-left: 0.5rem; }
    .space-x-3 > :not([hidden]) ~ :not([hidden]) { margin-left: 0.75rem; }
    .space-y-2 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem; }
    .space-y-4 > :not([hidden]) ~ :not([hidden]) { margin-top: 1rem; }
    
    /* Premium Themes Violet & Slate Coloring Map properties */
    .bg-slate-800 { background-color: #1e293b; }
    .bg-slate-850 { background-color: #151f32; }
    .bg-slate-900 { background-color: #0f172a; }
    .bg-slate-900\/40 { background-color: rgba(15, 23, 42, 0.4); }
    .bg-slate-900\/20 { background-color: rgba(15, 23, 42, 0.2); }
    .bg-slate-700 { background-color: #334155; }
    .bg-black\/30 { background-color: rgba(0, 0, 0, 0.3); }
    .bg-black\/50 { background-color: rgba(0, 0, 0, 0.5); }
    .bg-red-600 { background-color: #dc2626; }
    .bg-red-950 { background-color: #450a0a; }
    .bg-green-400 { background-color: #4ade80; }
    .bg-green-500 { background-color: #22c55e; }
    .bg-violet-600 { background-color: #7c3aed; }
    .bg-gradient-to-r { background-image: linear-gradient(to right, var(--tw-gradient-stops)); }
    .from-violet-600 { --tw-gradient-from: #7c3aed; --tw-gradient-to: rgb(124 58 237 / 0); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
    .to-indigo-600 { --tw-gradient-to: #4f46e5; }
    
    /* Text Typography setups formatting elements structures */
    .text-slate-100 { color: #f8fafc; }
    .text-slate-300 { color: #cbd5e1; }
    .text-slate-400 { color: #94a3b8; }
    .text-white { color: #ffffff; }
    .text-indigo-200 { color: #c7d2fe; }
    .text-violet-400 { color: #a78bfa; }
    .text-red-400 { color: #fca5a5; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .font-bold { font-weight: 700; }
    .font-medium { font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .italic { font-style: italic; }
    .uppercase { text-transform: uppercase; }
    .tracking-wide { letter-spacing: 0.025em; }
    .tracking-wider { letter-spacing: 0.05em; }
    .text-right { text-align: right; }
    
    /* Component Positioning, Overlays, and Adjustments configurations */
    .justify-center { justify-content: center; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .items-end { align-items: flex-end; }
    .items-start { align-items: flex-start; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-full { border-radius: 9999px; }
    .rounded { border-radius: 0.25rem; }
    .border { border-width: 1px; }
    .border-r { border-right-width: 1px; }
    .border-t { border-top-width: 1px; }
    .border-b { border-bottom-width: 1px; }
    .border-slate-700 { border-color: #334155; }
    .border-slate-600 { border-color: #475569; }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .absolute { position: absolute; }
    .inset-0 { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    .z-50 { z-index: 50; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .gap-4 { gap: 1rem; }
    .object-cover { object-fit: cover; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .whitespace-nowrap { white-space: nowrap; }
    .break-words { overflow-wrap: break-word; }
    
    /* Interactions triggers animations layout properties configuration drivers */
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .transition-colors { transition-property: background-color, border-color, color, fill, stroke; transition-duration: 150ms; }
    .transition-all { transition-property: all; transition-duration: 150ms; }
    .focus\:outline-none:focus { outline: 2px solid transparent; outline-offset: 2px; }
    .focus\:border-violet-500:focus { border-color: #8b5cf6; }
    .hover\:bg-slate-800:hover { background-color: #0f172a; }
    .hover\:bg-violet-500:hover { background-color: #8b5cf6; }
    .hover\:bg-red-500:hover { background-color: #ef4444; }
    .active\:scale-95:active { transform: scale(0.95); }
    
    /* Scrollbars logic drivers properties configuration */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex justify-center items-center p-2 sm:p-4">

  <!-- Main Grid Framework Base Box -->
  <div class="w-full max-w-5xl h-[90vh] bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl flex overflow-hidden relative">
    
    <!-- Sidebar: Left Panel (Active Online Users) -->
    <div class="hidden md:flex flex-col w-64 bg-slate-850 border-r border-slate-700 p-4">
      <div class="flex items-center space-x-2 pb-4 border-b border-slate-700 mb-4">
        <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></span>
        <h2 class="font-bold text-sm uppercase tracking-wider text-slate-400">Online Users (<span id="userCountSide">0</span>)</h2>
      </div>
      <div id="usersList" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar text-sm text-slate-300">
        <!-- Javascript dynamically updates names here -->
      </div>
    </div>

    <!-- Main Chat Window Framework (Right Pane) -->
    <div class="flex-1 flex flex-col h-full bg-slate-800">
      
      <!-- Top Header Layout Panel -->
      <div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
          <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
          <div>
            <h1 class="text-base sm:text-lg font-bold tracking-wide">Global Chatroom</h1>
            <p class="text-[11px] text-indigo-200 md:hidden"><span id="userCountHeader">0</span> online</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400 hidden sm:inline">Logged in as:</span>
          <span id="userBadge" class="text-xs bg-black/30 px-3 py-1 rounded-full text-indigo-200 font-mono font-bold">Connecting...</span>
        </div>
      </div>

      <!-- Messages Viewport Stream Area -->
      <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4 custom-scrollbar bg-slate-900/40">
        <!-- Dynamic list modules append yahan honge -->
      </div>

      <!-- Live Typing State Output Field Indicator -->
      <div class="px-4 py-1 h-6 text-xs italic text-violet-400 font-medium bg-slate-900/20">
        <span id="typingIndicator"></span>
      </div>

      <!-- Footer Inputs Form Bar -->
      <form id="chatForm" class="p-3 bg-slate-850 border-t border-slate-700 flex items-center space-x-2">
        <input 
          type="text" 
          id="msgInput" 
          placeholder="Type your message..." 
          autocomplete="off"
          class="flex-1 bg-slate-700 border border-slate-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-violet-500 transition-colors text-white placeholder-slate-400"
        >
        <button 
          type="submit"
          class="bg-violet-600 hover:bg-violet-500 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition-all shadow-lg active:scale-95 whitespace-nowrap"
        >
          Send
        </button>
      </form>
    </div>

    <!-- ================= WebRTC Video Calling Window overlay ================= -->
    <div id="callOverlay" class="hidden absolute inset-0 bg-slate-950/90 z-50 flex flex-col justify-center items-center p-4">
      <h2 id="callStatusHeader" class="text-xl font-bold mb-4 text-violet-400">Calling...</h2>
      
      <!-- Video Streams Grid -->
      <div class="w-full max-w-4xl flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[60vh] mb-6">
        <!-- Remote view layout stream container -->
        <div class="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden relative">
          <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
          <span class="absolute bottom-2 left-3 bg-black/50 px-2 py-0.5 rounded text-xs">Remote User</span>
        </div>
        <!-- Local camera layout preview container -->
        <div class="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden relative">
          <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <span class="absolute bottom-2 left-3 bg-black/50 px-2 py-0.5 rounded text-xs">You</span>
        </div>
      </div>

      <!-- Control Panel Call End Actions -->
      <div class="flex items-center space-x-4">
        <button id="endCallBtn" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg transition-transform active:scale-95">
          End Call
        </button>
      </div>
    </div>

  </div>

  <!-- WebSocket Pipeline and WebRTC Signaling Script Engine -->
  <script>
    let username = '';
    while (!username.trim()) {
      username = prompt('Apna Username enter karein:') || '';
    }
    document.getElementById('userBadge').textContent = username;

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(`${protocol}//${window.location.host}`);
    
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const msgInput = document.getElementById('msgInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const userCountSide = document.getElementById('userCountSide');
    const userCountHeader = document.getElementById('userCountHeader');
    const usersList = document.getElementById('usersList');
    
    const callOverlay = document.getElementById('callOverlay');
    const callStatusHeader = document.getElementById('callStatusHeader');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const endCallBtn = document.getElementById('endCallBtn');

    let typingTimeout;
    let localStream;
    let peerConnection;
    let currentCallTarget = null;

    // Fixed configuration mapping URLs
    const rtcConfig = {
      iceServers: [{ urls: 'stun:://google.com' }]
    };

    socket.onopen = () => {
      socket.send(JSON.stringify({ type: 'join', username: username }));
    };

    function appendMessage(msg) {
      const isMe = msg.username === username;
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      const timeString = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msgWrapper.innerHTML = `
        <span class="text-xs text-slate-400 mb-1 px-1">${isMe ? 'You' : msg.username}</span>
        <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm shadow-sm ${
          isMe ? 'bg-violet-600 text-white rounded-tr-none' : 'bg-slate-700 text-slate-100 rounded-tl-none'
        }">
          <p class="break-words">${msg.text}</p>
          <span class="block text-[10px] text-right mt-1 opacity-60">${timeString}</span>
        </div>
      `;
      chatBox.appendChild(msgWrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function startMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
      } catch (err) {
        console.error('Camera/Mic access failed:', err);
        alert('Call ke liye Camera aur Mic ki permissions zaroori hain!');
      }
    }


       async function dialCall(targetUser) {
      currentCallTarget = targetUser;
      callOverlay.classList.remove('hidden');
      callStatusHeader.textContent = `${targetUser} ko call lag rahi hai...`;
      
      await startMedia();
      createPeerConnection(targetUser);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.send(JSON.stringify({
        type: 'call-user',
        to: targetUser,
        from: username,
        offer: offer
      }));
    }

    socket.onmessage = async (event) => {
      const response = JSON.parse(event.data);
      
      if (response.type === 'history') {
        chatBox.innerHTML = '';
        response.data.forEach(msg => appendMessage(msg));
      } 
      else if (response.type === 'message') {
        appendMessage(response.data);
      } 
      else if (response.type === 'typing') {
        typingIndicator.textContent = response.isTyping ? `${response.username} is typing...` : '';
      } 
      else if (response.type === 'userStatus') {
        userCountSide.textContent = response.count;
        userCountHeader.textContent = response.count;
        
        usersList.innerHTML = '';
        response.users.forEach(user => {
          const userDiv = document.createElement('div');
          userDiv.className = "flex items-center justify-between py-1 px-2 rounded hover:bg-slate-800 transition-colors";
          
          let callBtnHtml = '';
          if (user !== username) {
            callBtnHtml = `<button onclick="dialCall('${user}')" class="bg-violet-600 hover:bg-violet-500 text-[10px] px-2 py-1 rounded font-bold transition-all"> Call </button>`;
          }

          userDiv.innerHTML = `
            <div class="flex items-center space-x-2 truncate">
              <span class="w-2 h-2 bg-green-400 rounded-full"></span>
              <span class="truncate">${user === username ? `${user} (You)` : user}</span>
            </div>
            ${callBtnHtml}
          `;
          usersList.appendChild(userDiv);
        });
      }
      else if (response.type === 'call-made') {
        const accept = confirm(`${response.from} aapko video call kar raha hai. Kya aap uthana chahte hain?`);
        currentCallTarget = response.from;
        if (accept) {
          callOverlay.classList.remove('hidden');
          callStatusHeader.textContent = `${response.from} ke sath call active hai`;
          await startMedia();
          createPeerConnection(response.from);
          await peerConnection.setRemoteDescription(new RTCSessionDescription(response.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.send(JSON.stringify({
            type: 'make-answer',
            to: response.from,
            from: username,
            answer: answer
          }));
        } else {
          socket.send(JSON.stringify({ type: 'end-call', to: response.from }));
        }
      }
      else if (response.type === 'answer-made') {
        callStatusHeader.textContent = `${currentCallTarget} ke sath call active hai`;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(response.answer));
      }
      else if (response.type === 'ice-candidate') {
        if (peerConnection) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(response.candidate));
          } catch (e) {
            console.error('Error adding received ice candidate', e);
          }
        }
      }
      else if (response.type === 'end-call') {
        closeCallUI();
      }
    };

    function closeCallUI() {
      callOverlay.classList.add('hidden');
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      currentCallTarget = null;
    }

    endCallBtn.addEventListener('click', () => {
      if (currentCallTarget) {
        socket.send(JSON.stringify({ type: 'end-call', to: currentCallTarget }));
      }
      closeCallUI();
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (text && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'message', username, text }));
        msgInput.value = '';
        socket.send(JSON.stringify({ type: 'typing', username, isTyping: false }));
      }
    });

    msgInput.addEventListener('input', () => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'typing', username, isTyping: true }));
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.send(JSON.stringify({ type: 'typing', username, isTyping: false }));
        }, 1500);
      }
    });

    socket.onclose = () => {
      document.getElementById('userBadge').textContent = 'Disconnected';
      document.getElementById('userBadge').className = "text-xs bg-red-950 px-3 py-1 rounded-full text-red-400 font-mono";
      closeCallUI();
    };
  </script>
</body>
</html>
